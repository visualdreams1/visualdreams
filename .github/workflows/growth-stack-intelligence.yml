name: Growth Stack Intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python
        run: python -m compileall -q growth-stack-master
      - name: Run research, discovery, multichannel intelligence, sales and monitoring
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          OUTBOUND_ENABLED: ${{ secrets.OUTBOUND_ENABLED }}
          SALES_SENDER_WEBHOOK: ${{ secrets.SALES_SENDER_WEBHOOK }}
          MAX_SALES_SENDS_PER_RUN: ${{ vars.MAX_SALES_SENDS_PER_RUN }}
          SALES_SEND_DELAY_SECONDS: ${{ vars.SALES_SEND_DELAY_SECONDS }}
          MAX_MULTICHANNEL_LEADS: ${{ vars.MAX_MULTICHANNEL_LEADS }}
          MAX_LEADS_PER_RUN: ${{ vars.MAX_LEADS_PER_RUN }}
          MAX_FOLLOWUPS_PER_RUN: ${{ vars.MAX_FOLLOWUPS_PER_RUN }}
          DISCOVERY_RESULTS_PER_QUERY: ${{ vars.DISCOVERY_RESULTS_PER_QUERY }}
          DISCOVERY_MAX_PAGES_PER_QUERY: ${{ vars.DISCOVERY_MAX_PAGES_PER_QUERY }}
          DISCOVERY_DELAY_SECONDS: ${{ vars.DISCOVERY_DELAY_SECONDS }}
        run: |
          python growth-stack-master/run_intelligence.py
          python growth-stack-master/followup_engine.py
      - name: Commit intelligence state
        run: |
          git config user.name "growth-stack-intelligence"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add growth-stack-master/state growth-stack-master/DECISION_QUEUE.md growth-stack-master/MONITORING_DASHBOARD.html
          git diff --cached --quiet || git commit -m "Update Growth Stack autonomous intelligence state"
          git push
