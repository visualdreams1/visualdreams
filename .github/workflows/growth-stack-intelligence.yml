name: Growth Stack Intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run live research + intelligence + monitoring
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: python growth-stack-master/run_intelligence.py
      - name: Commit intelligence state
        run: |
          git config user.name "growth-stack-intelligence"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add growth-stack-master/state growth-stack-master/DECISION_QUEUE.md growth-stack-master/MONITORING_DASHBOARD.html
          git diff --cached --quiet || git commit -m "Update Growth Stack intelligence decision queue"
          git push
