name: Growth Stack Intelligence
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python
        run: python -m compileall -q growth-stack-master
      - name: Run autonomous revenue operator
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          OUTBOUND_ENABLED: ${{ secrets.OUTBOUND_ENABLED || 'false' }}
          SALES_SENDER_WEBHOOK: ${{ secrets.SALES_SENDER_WEBHOOK }}
          WHATSAPP_CLOUD_API_VERSION: ${{ vars.WHATSAPP_CLOUD_API_VERSION || 'v23.0' }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_TEMPLATE_NAME: ${{ vars.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_TEMPLATE_LANGUAGE: ${{ vars.WHATSAPP_TEMPLATE_LANGUAGE || 'en_US' }}
          WHATSAPP_ALLOW_FREEFORM: ${{ vars.WHATSAPP_ALLOW_FREEFORM || 'false' }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${{ secrets.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
          MPESA_DARAJA_BASE_URL: ${{ secrets.MPESA_DARAJA_BASE_URL }}
          MPESA_CONSUMER_KEY: ${{ secrets.MPESA_CONSUMER_KEY }}
          MPESA_CONSUMER_SECRET: ${{ secrets.MPESA_CONSUMER_SECRET }}
          MPESA_SHORTCODE: ${{ secrets.MPESA_SHORTCODE }}
          MPESA_PASSKEY: ${{ secrets.MPESA_PASSKEY }}
          MPESA_CALLBACK_URL: ${{ secrets.MPESA_CALLBACK_URL }}
          MPESA_NUMBER: ${{ secrets.MPESA_NUMBER || '0746352017' }}
          MAX_SALES_SENDS_PER_RUN: ${{ vars.MAX_SALES_SENDS_PER_RUN || '10' }}
          SALES_SEND_DELAY_SECONDS: ${{ vars.SALES_SEND_DELAY_SECONDS || '5' }}
          MAX_MULTICHANNEL_LEADS: ${{ vars.MAX_MULTICHANNEL_LEADS || '100' }}
          MAX_LEADS_PER_RUN: ${{ vars.MAX_LEADS_PER_RUN || '50' }}
          MAX_FOLLOWUPS_PER_RUN: ${{ vars.MAX_FOLLOWUPS_PER_RUN || '20' }}
          DISCOVERY_RESULTS_PER_QUERY: ${{ vars.DISCOVERY_RESULTS_PER_QUERY || '20' }}
          DISCOVERY_MAX_PAGES_PER_QUERY: ${{ vars.DISCOVERY_MAX_PAGES_PER_QUERY || '8' }}
          DISCOVERY_DELAY_SECONDS: ${{ vars.DISCOVERY_DELAY_SECONDS || '0.5' }}
          OPERATOR_CYCLES: ${{ vars.OPERATOR_CYCLES || '3' }}
          OPERATOR_RESEARCH_LIMIT: ${{ vars.OPERATOR_RESEARCH_LIMIT || '500' }}
          OPERATOR_CYCLE_DELAY_SECONDS: ${{ vars.OPERATOR_CYCLE_DELAY_SECONDS || '5' }}
          MILLION_TARGET_KES: '1000000'
        run: |
          python growth-stack-master/autonomous_operator.py
          python growth-stack-master/followup_engine.py
      - name: Commit intelligence state
        run: |
          git config user.name "growth-stack-intelligence"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add growth-stack-master/state growth-stack-master/DECISION_QUEUE.md growth-stack-master/MONITORING_DASHBOARD.html
          git diff --cached --quiet || git commit -m "Run autonomous Growth Stack revenue operator"
          git push
